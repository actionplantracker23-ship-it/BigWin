name: Publication GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe JavaScript
        run: node --check assets/app.js
      - name: Générer la configuration à partir des secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Ajoutez les secrets SUPABASE_URL et SUPABASE_KEY (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          mkdir site && cp -r index.html assets data site/
          rm -f site/assets/config.example.js
          # Numéro de version : force le navigateur à recharger CSS et JS à chaque publication
          sed -i "s/__VERSION__/${GITHUB_SHA::8}/g" site/index.html
          printf 'window.BIGWIN_CONFIG = { supabaseUrl: "%s", supabaseKey: "%s", pays: "Burkina Faso", annee: 2026 };\n' \
            "$SUPABASE_URL" "$SUPABASE_KEY" > site/assets/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
